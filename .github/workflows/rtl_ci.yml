name: RTL Verification & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verilog-lint-and-syntax:
    name: Verilog HDL Syntax & Compilation Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog EDA Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: "Audit Track 1: Proposed BDI L2 Cache IP Core Syntax"
        run: |
          echo "=== Auditing rtl/bdi_cache/*.v ==="
          iverilog -Wall -t null rtl/bdi_cache/l2_ram_block.v \
                                rtl/bdi_cache/l2_bdi_compressor.v \
                                rtl/bdi_cache/l2_bdi_decompressor.v \
                                rtl/bdi_cache/l2_hazard_interlock_unit.v \
                                rtl/bdi_cache/l2_cache_storage_array.v \
                                rtl/bdi_cache/l2_adaptive_power_governor.v \
                                rtl/bdi_cache/l2_csr_control_bank.v \
                                rtl/bdi_cache/l2_pipeline_input_stage.v \
                                rtl/bdi_cache/l2_bdi_cache_top.v

      - name: "Audit Track 2: Baseline Conventional Cache Syntax"
        run: |
          echo "=== Auditing rtl/conventional_cache/*.v ==="
          iverilog -Wall -t null rtl/conventional_cache/l2_conventional_cache_top.v

      - name: "Audit Track 3: Physical Board Demo Syntax"
        run: |
          echo "=== Auditing rtl/board_demo/*.v ==="
          iverilog -Wall -t null rtl/board_demo/l2_ram_block.v \
                                rtl/board_demo/l2_bdi_compressor.v \
                                rtl/board_demo/l2_bdi_decompressor.v \
                                rtl/board_demo/l2_hazard_interlock_unit.v \
                                rtl/board_demo/l2_cache_storage_array.v \
                                rtl/board_demo/l2_adaptive_power_governor.v \
                                rtl/board_demo/l2_csr_control_bank.v \
                                rtl/board_demo/l2_pipeline_input_stage.v \
                                rtl/board_demo/l2_bdi_cache_top.v \
                                rtl/board_demo/l2_bdi_cache_board_demo.v

      - name: "Audit Track 4: Multi-Core SoC Hierarchy Extensions Syntax"
        run: |
          echo "=== Auditing future_work/rtl/*.v ==="
          iverilog -Wall -t null rtl/bdi_cache/l2_ram_block.v \
                                rtl/bdi_cache/l2_bdi_compressor.v \
                                rtl/bdi_cache/l2_bdi_decompressor.v \
                                rtl/bdi_cache/l2_hazard_interlock_unit.v \
                                rtl/bdi_cache/l2_cache_storage_array.v \
                                rtl/bdi_cache/l2_adaptive_power_governor.v \
                                rtl/bdi_cache/l2_csr_control_bank.v \
                                rtl/bdi_cache/l2_pipeline_input_stage.v \
                                rtl/bdi_cache/l2_bdi_cache_top.v \
                                future_work/rtl/l1_dcache_core.v \
                                future_work/rtl/l1_l2_bus_arbiter.v \
                                future_work/rtl/l2_hardware_prefetcher.v \
                                future_work/rtl/l2_cache_controller.v \
                                future_work/rtl/soc_cache_subsystem.v

  scripts-and-deliverables-audit:
    name: Automation Scripts & Release Deliverables Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python Deliverables Exporter
        run: |
          python -m py_compile poster/latex_source/export_deliverables.py
          echo "Python export scripts compiled cleanly."

      - name: Install Tcl Shell & Audit ISSP Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y tcl
          test -f synth/board_demo/issp_scripts/issp_signal_map.tcl || exit 1
          test -f synth/board_demo/issp_scripts/issp_read_telemetry.tcl || exit 1
          test -f synth/board_demo/issp_scripts/issp_inject_test_vector.tcl || exit 1
          test -f synth/board_demo/issp_scripts/issp_automated_validation.tcl || exit 1
          test -f synth/board_demo/issp_scripts/README_ISSP_GUIDE.md || exit 1
          echo "source synth/board_demo/issp_scripts/issp_signal_map.tcl; puts \"ISSP Signal Map Tcl Library Verified.\"" | tclsh

      - name: Verify Key Artifacts & Project Integrity
        run: |
          test -f poster/EngPoster.pdf || exit 1
          test -f poster/RTL.pdf || exit 1
          test -f README.md || exit 1
          test -f README_AR.md || exit 1
          test -f LICENSE || exit 1
          test -f CITATION.cff || exit 1
          test -f CONTRIBUTING.md || exit 1
          test -f future_work/README.md || exit 1
          test -f future_work/sim/run_sim_soc.do || exit 1
          test -f synth/bdi_cache/l2_bdi_cache_top.qsf || exit 1
          test -f synth/conventional_cache/l2_conventional_cache_top.qsf || exit 1
          test -f synth/board_demo/l2_bdi_cache_board_demo.qsf || exit 1
          test -f future_work/synth/soc_cache_subsystem.qsf || exit 1
          echo "All release artifacts and Quartus project descriptors verified."
